name: Android debug APK

on:
  push:
    branches:
      - feature/custom-colors
      - fix/import-redundant-resort
      - fix/empty-history-import-oom
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run core JVM tests
        run: ./gradlew :uhabits-core:jvmTest --no-daemon
      - name: Build debug APK
        run: ./gradlew :uhabits-android:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uhabits-custom-colors-debug
          path: uhabits-android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
